<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kreezswhqbnxvosmbxmu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sx3jrzgB5jhpgC9OU2FkGw_8lvWCIti";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   DEĞİŞKENLER
========================= */

let selectedGender = "";

let currentUsername = "";

let currentRoom = "#Cinsellik";

let currentRole = "user";

let realtimeChannel = null;

let onlineRealtimeChannel = null;

const displayedMessageIds =
  new Set();

const recentLocalMessages =
  new Map();


/* =========================
   YARDIMCI
========================= */

function isStaff(){

  return (
    currentRole === "admin" ||
    currentRole === "moderator"
  );

}


/* =========================
   GİRİŞ MESAJI
========================= */

function showMessage(
  text,
  error=false
){

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent =
    text;

  box.style.color =
    error
      ? "#ff5c5c"
      : "#55e67a";
}


/* =========================
   CİNSİYET
========================= */

function selectGender(button){

  selectedGender =
    button.dataset.gender;

  document
    .querySelectorAll(
      ".gender button"
    )
    .forEach(
      btn=>{

        btn.classList.remove(
          "active"
        );

      }
    );

  button.classList.add(
    "active"
  );
}


/* =========================
   EMAIL
========================= */

function usernameEmail(username){

  let clean =
    username
      .toLowerCase()
      .trim()
      .replace(/ğ/g,"g")
      .replace(/ü/g,"u")
      .replace(/ş/g,"s")
      .replace(/ı/g,"i")
      .replace(/ö/g,"o")
      .replace(/ç/g,"c")
      .replace(/[^a-z0-9]/g,"");

  return clean +
    "@cinselsohbet.com";
}


/* =========================
   BAN KONTROLÜ
========================= */

async function checkBan(
  username
){

  if(!username)
    return false;


  const result =
    await supabaseClient
      .from("banned_users")
      .select(
        "id,username,reason,expires_at"
      )
      .eq(
        "username",
        username
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1);


  if(result.error){

    console.error(
      "Ban kontrolü:",
      result.error
    );

    return false;
  }


  if(
    !result.data ||
    result.data.length === 0
  ){

    return false;
  }


  const ban =
    result.data[0];


  if(
    ban.expires_at &&
    new Date(ban.expires_at)
      .getTime() <= Date.now()
  ){

    await supabaseClient
      .from("banned_users")
      .delete()
      .eq(
        "id",
        ban.id
      );

    return false;
  }


  alert(
    "Bu kullanıcı banlı.\n\n" +
    "Sebep: " +
    (ban.reason || "Belirtilmedi") +
    "\n\nBitiş: " +
    formatDateTime(
      ban.expires_at
    )
  );


  return true;
}


/* =========================
   SUSTURMA KONTROLÜ
========================= */

async function checkMute(
  username
){

  if(!username)
    return false;


  const result =
    await supabaseClient
      .from("muted_users")
      .select(
        "id,username,reason,expires_at"
      )
      .eq(
        "username",
        username
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1);


  if(result.error){

    console.error(
      "Susturma kontrolü:",
      result.error
    );

    return false;
  }


  if(
    !result.data ||
    result.data.length === 0
  ){

    return false;
  }


  const mute =
    result.data[0];


  if(
    mute.expires_at &&
    new Date(mute.expires_at)
      .getTime() <= Date.now()
  ){

    await supabaseClient
      .from("muted_users")
      .delete()
      .eq(
        "id",
        mute.id
      );

    return false;
  }


  alert(
    "Susturuldunuz.\n\n" +
    "Sebep: " +
    (mute.reason || "Belirtilmedi") +
    "\n\nBitiş: " +
    formatDateTime(
      mute.expires_at
    )
  );


  return true;
}


/* =========================
   TARİH
========================= */

function formatDateTime(
  value
){

  if(!value)
    return "Belirsiz";


  const date =
    new Date(value);


  return date.toLocaleString(
    "tr-TR"
  );
}


/* =========================
   PROFİL
========================= */

async function loadMyProfile(){

  const userResult =
    await supabaseClient
      .auth
      .getUser();

  if(
    userResult.error ||
    !userResult.data.user
  ){

    currentRole =
      "user";

    updateAdminButton();

    return;
  }


  const userId =
    userResult.data.user.id;


  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "username,gender,role"
      )
      .eq(
        "id",
        userId
      )
      .maybeSingle();


  if(result.error){

    console.error(
      "Profil yükleme:",
      result.error
    );

    currentRole =
      "user";

    updateAdminButton();

    return;
  }


  if(result.data){

    currentRole =
      result.data.role ||
      "user";


    if(result.data.username){

      currentUsername =
        result.data.username;

      localStorage.setItem(
        "username",
        currentUsername
      );

    }

  }


  updateAdminButton();
}

async function registerUser(){

      .getElementById(
        "username"
      )

      .trim();


  const password =

      .getElementById(
        "password"
      )
      .value;

    );

    );

  }


  if(username.length < 3){

    showMessage(

      true
    );

    return;
  }


  if(!password){

    showMessage(
      "Şifre yaz.",
      true
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Şifre en az 6 karakter olmalı.",
      true
    );

    return;
  }


  button.disabled =
    true;

  button.textContent =
    "Bekleyin...";


  showMessage(
    "Giriş yapılıyor..."
  );


  try{

    const email =
      usernameEmail(
        username
      );


    const loginResult =
      await supabaseClient
        .auth
        .signInWithPassword({

          email:email,

          password:password

        });


    if(!loginResult.error){

      currentUsername =
        username;


      localStorage.setItem(
        "username",
        username
      );


      const banned =
        await checkBan(
          currentUsername
        );


      if(banned){

        await supabaseClient
          .auth
          .signOut();

        return;
      }


      await loadMyProfile();

      await enterChat();

      return;
    }


    const registerResult =
      await supabaseClient
        .auth
        .signUp({

          email:email,

          password:password,

          options:{

            data:{

              username:
                username,

              gender:
                selectedGender

            }

          }

        });


    if(registerResult.error){

      showMessage(
        registerResult.error.message,
        true
      );

      console.error(
        registerResult.error
      );

      return;
    }


    if(
      !registerResult.data.session
    ){

      showMessage(
        "Hesap oluşturuldu fakat giriş yapılamadı. E-posta doğrulaması açıksa e-postanı doğrula.",
        true
      );

      return;
    }


    currentUsername =
      username;


    localStorage.setItem(
      "username",
      username
    );


    await loadMyProfile();

    await enterChat();


  }catch(error){

    console.error(
      error
    );

    showMessage(
      "Hata: " +
      error.message,
      true
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Sohbete Gir";

  }

}

/* =========================
   MESAJ ANAHTARI
========================= */

function getMessageKey(
  message
){

  return [
    message.room || "",
    message.username || "",
    message.message || ""
  ].join("|");

}


/* =========================
   MESAJI EKRANA EKLE
========================= */

function addMessageToScreen(
  message
){

  const box =
    document.getElementById(
      "messages"
    );


  if(!box)
    return;


  if(message.id){

    if(
      displayedMessageIds.has(
        message.id
      )
    ){

      return;

    }

    displayedMessageIds.add(
      message.id
    );

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message";


  /*
     SİLİNMİŞ MESAJ
  */

  if(message.deleted){

    const deleted =
      document.createElement(
        "span"
      );


    deleted.className =
      "deleted-message";


    deleted.textContent =
      "🗑️ Mesaj moderasyon tarafından silindi.";


    div.appendChild(
      deleted
    );


    box.appendChild(
      div
    );


    box.scrollTop =
      box.scrollHeight;


    return;
  }


  const username =
    document.createElement(
      "b"
    );


  username.textContent =
    (message.username || "Bilinmeyen") +
    ":";


  div.appendChild(
    username
  );


  const text =
    document.createTextNode(
      " " +
      (message.message || "")
    );


  div.appendChild(
    text
  );


  const time =
    document.createElement(
      "span"
    );


  time.className =
    "message-time";


  const date =
    new Date(
      message.created_at ||
      Date.now()
    );


  time.textContent =
    date.toLocaleTimeString(
      "tr-TR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  div.appendChild(
    time
  );


  /*
     MODERATÖR / ADMIN BUTONLARI
  */

  if(
    isStaff() &&
    message.id
  ){

    const actions =
      document.createElement(
        "span"
      );


    actions.className =
      "message-actions";


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "message-action message-delete";


    deleteButton.textContent =
      "🗑️ Sil";


    deleteButton.onclick =
      function(){

        deleteMessage(
          message.id
        );

      };


    actions.appendChild(
      deleteButton
    );


    /*
       Başka kullanıcıya işlem
    */

    if(
      message.username &&
      message.username !==
      currentUsername
    ){

      const muteButton =
        document.createElement(
          "button"
        );


      muteButton.className =
        "message-action message-mute";


      muteButton.textContent =
        "🔇 Sustur";


      muteButton.onclick =
        function(){

          openModerationBox(
            "mute",
            message.username
          );

        };


      actions.appendChild(
        muteButton
      );


      const banButton =
        document.createElement(
          "button"
        );


      banButton.className =
        "message-action message-ban";


      banButton.textContent =
        "🚫 Ban";


      banButton.onclick =
        function(){

          openModerationBox(
            "ban",
            message.username
          );

        };


      actions.appendChild(
        banButton
      );

    }


    div.appendChild(
      actions
    );

  }


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;
}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text)
    return;


  if(!currentUsername){

    alert(
      "Önce giriş yapmalısın."
    );

    return;
  }


  /*
     BAN KONTROLÜ
  */

  if(
    currentRole !== "guest"
  ){

    const banned =
      await checkBan(
        currentUsername
      );


    if(banned){

      input.value =
        "";

      return;
    }
  }


  /*
     SUSTURMA KONTROLÜ
  */

  if(
    currentRole !== "guest"
  ){

    const muted =
      await checkMute(
        currentUsername
      );


    if(muted){

      input.value =
        "";

      return;
    }
  }


  input.disabled =
    true;


  const newMessage = {

    room:
      currentRoom,

    username:
      currentUsername,

    message:
      text

  };


  /*
     MESAJI HEMEN EKRANA KOY
  */

  const optimisticMessage = {

    ...newMessage,

    created_at:
      new Date().toISOString(),

    optimistic:true

  };


  const messageKey =
    getMessageKey(
      optimisticMessage
    );


  recentLocalMessages.set(
    messageKey,
    Date.now()
  );


  addMessageToScreen(
    optimisticMessage
  );


  input.value =
    "";


  try{

    const result =
      await supabaseClient
        .from("messages")
        .insert(
          newMessage
        );


    if(result.error){

      console.error(
        "Mesaj gönderme:",
        result.error
      );


      removeOptimisticMessage(
        messageKey
      );


      alert(
        "Mesaj gönderilemedi: " +
        result.error.message
      );


      input.value =
        text;


      return;
    }


  }catch(error){

    console.error(
      "Mesaj hatası:",
      error
    );


    removeOptimisticMessage(
      messageKey
    );


    input.value =
      text;


    alert(
      "Mesaj gönderilirken hata oluştu: " +
      error.message
    );


  }finally{

    input.disabled =
      false;

    input.focus();


    setTimeout(
      function(){

        const savedTime =
          recentLocalMessages.get(
            messageKey
          );


        if(
          savedTime &&
          Date.now() - savedTime >= 10000
        ){

          recentLocalMessages.delete(
            messageKey
          );

        }

      },
      10500
    );

  }

}


/* =========================
   OPTIMISTIC MESAJ SİL
========================= */

function removeOptimisticMessage(
  messageKey
){

  const box =
    document.getElementById(
      "messages"
    );


  if(!box)
    return;


  const children =
    Array.from(
      box.children
    );


  for(
    let i = children.length - 1;
    i >= 0;
    i--
  ){

    const child =
      children[i];


    const bold =
      child.querySelector(
        "b"
      );


    if(!bold)
      continue;


    const username =
      bold.textContent
        .replace(
          /:$/,
          ""
        );


    const timeElement =
      child.querySelector(
        ".message-time"
      );


    const timeText =
      timeElement
        ? timeElement.textContent
        : "";


    const messageText =
      child.textContent
        .replace(
          bold.textContent,
          ""
        )
        .replace(
          timeText,
          ""
        )
        .replace(
          "🗑️ Mesaj moderasyon tarafından silindi.",
          ""
        )
        .trim();


    const candidateKey =
      [
        currentRoom,
        username,
        messageText
      ].join("|");


    if(
      candidateKey ===
      messageKey
    ){

      child.remove();

      break;

    }

  }

}

/* =========================
   REALTIME MESAJLAR
========================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "messages-channel-" +
        Date.now() +
        "-" +
        Math.random()
      )
      .on(
        "postgres_changes",
        {

          event:"INSERT",

          schema:"public",

          table:"messages"

        },

        payload=>{

          const message =
            payload.new;


          if(
            message.room !==
            currentRoom
          ){

            return;

          }


          const messageKey =
            getMessageKey(
              message
            );


          const localTime =
            recentLocalMessages.get(
              messageKey
            );


          if(
            localTime &&
            Date.now() - localTime < 10000
          ){

            return;

          }


          addMessageToScreen(
            message
          );

        }
      )
      .on(
        "postgres_changes",
        {

          event:"UPDATE",

          schema:"public",

          table:"messages"

        },

        payload=>{

          const message =
            payload.new;


          if(
            message.room !==
            currentRoom
          ){

            return;

          }


          refreshSingleMessage(
            message
          );

        }
      )
      .subscribe(
        status=>{

          console.log(
            "Mesaj Realtime:",
            status
          );

        }
      );

}


/* =========================
   TEK MESAJI YENİLE
========================= */

function refreshSingleMessage(
  message
){

  const box =
    document.getElementById(
      "messages"
    );


  if(!box)
    return;


  if(!message.id)
    return;


  const existing =
    Array.from(
      box.children
    ).find(
      element=>{

        return element.dataset.messageId ===
          String(message.id);

      }
    );


  if(existing){

    existing.remove();

  }


  /*
     ID'yi tekrar oluşturabilmek
     için set'ten çıkar.
  */

  displayedMessageIds.delete(
    message.id
  );


  addMessageToScreen(
    message
  );

}

async function deleteMessage(
  messageId
){

  if(!isStaff()){

    return;
  }


  if(
    !confirm(
      "Bu mesaj silinsin mi?"
    )
  ){

    return;
  }


  const result =
    await supabaseClient
      .rpc(
        "delete_chat_message",
        {
          target_message_id:
            messageId
        }
      );


  if(result.error){

    console.error(
      "Mesaj silme:",
      result.error
    );


    alert(
      "Mesaj silinemedi: " +
      result.error.message
    );

    return;
  }


  /*
     Realtime UPDATE gelmezse
     kendi ekranımızı da yenile.
  */

  const box =
    document.getElementById(
      "messages"
    );


  const existing =
    Array.from(
      box.children
    ).find(
      element=>{

        return element.dataset.messageId ===
          String(messageId);

      }
    );


  if(existing){

    existing.remove();

  }


  displayedMessageIds.delete(
    messageId
  );


  /*
     Mesajı tekrar veritabanından
     bulup silindi olarak göster.
  */

  const result2 =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "id",
        messageId
      )
      .maybeSingle();


  if(
    result2.data &&
    result2.data.room ===
    currentRoom
  ){

    addMessageToScreen(
      result2.data
    );

  }

}

/* =========================

async function applyModeration(
  type,
  username
){

  if(!isStaff())
    return;


  const durationElement =
    document.getElementById(
      "moderationDuration"
    );


  const reasonElement =
    document.getElementById(
      "moderationReason"
    );


  const duration =
    Number(
      durationElement.value
    );


  const reason =
    reasonElement.value.trim();


  if(!duration){

    alert(
      "Süre seçin."
    );

    return;
  }


  try{

    /*
       Kullanıcının profil ID'sini
       bulmaya çalış.
    */

    const profile =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username"
        )
        .eq(
          "username",
          username
        )
        .maybeSingle();


    const targetUserId =
      profile.data
        ? profile.data.id
        : null;


    let result;


    if(type === "ban"){

      result =
        await supabaseClient
          .rpc(
            "ban_user",
            {

              target_user_id:
                targetUserId,

              target_username:
                username,

              ban_reason:
                reason,

              duration_minutes:
                duration

            }
          );

    }else{

      result =
        await supabaseClient
          .rpc(
            "mute_user",
            {

              target_user_id:
                targetUserId,

              target_username:
                username,

              mute_reason:
                reason,

              duration_minutes:
                duration

            }
          );

    }


    if(result.error){

      console.error(
        "Moderasyon:",
        result.error
      );


      alert(
        "İşlem başarısız: " +
        result.error.message
      );


      return;
    }


    closeModerationBox();


    alert(
      type === "ban"
        ? username +
          " kullanıcısı banlandı."
        : username +
          " kullanıcısı susturuldu."
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "İşlem sırasında hata oluştu: " +
      error.message
    );

  }

}

/* =========================
   ADMIN KULLANICILARI
========================= */

async function loadAdminUsers(){

  const tbody =
    document.getElementById(
      "adminUsers"
    );


  if(!tbody)
    return;


  tbody.innerHTML =
    '<tr><td colspan="5" class="admin-empty">Yükleniyor...</td></tr>';


  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,gender,role,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      "Admin kullanıcıları:",
      result.error
    );


    tbody.innerHTML =
      '<tr><td colspan="5" class="admin-empty">' +
      'Kullanıcılar yüklenemedi: ' +
      result.error.message +
      '</td></tr>';

    return;
  }


  const users =
    result.data || [];


  let admins = 0;

  let moderators = 0;


  users.forEach(
    user=>{

      if(user.role === "admin")
        admins++;

      if(user.role === "moderator")
        moderators++;

    }
  );


  document
    .getElementById(
      "totalUsers"
    )
    .textContent =
      users.length;


  document
    .getElementById(
      "totalAdmins"
    )
    .textContent =
      admins;


  document
    .getElementById(
      "totalModerators"
    )
    .textContent =
      moderators;


  tbody.innerHTML =
    "";


  if(users.length === 0){

    tbody.innerHTML =
      '<tr><td colspan="5" class="admin-empty">' +
      'Kullanıcı bulunamadı.' +
      '</td></tr>';

    return;
  }


  users.forEach(
    user=>{

      const tr =
        document.createElement(
          "tr"
        );


      const usernameTd =
        document.createElement(
          "td"
        );


      usernameTd.textContent =
        user.username ||
        "-";


      const genderTd =
        document.createElement(
          "td"
        );


      genderTd.textContent =
        user.gender ||
        "-";


      const roleTd =
        document.createElement(
          "td"
        );


      const roleSpan =
        document.createElement(
          "span"
        );


      roleSpan.className =
        "role";


      if(
        user.role ===
        "admin"
      ){

        roleSpan.classList.add(
          "role-admin"
        );

        roleSpan.textContent =
          "Admin";

      }else if(
        user.role ===
        "moderator"
      ){

        roleSpan.classList.add(
          "role-moderator"
        );

        roleSpan.textContent =
          "Moderatör";

      }else{

        roleSpan.classList.add(
          "role-user"
        );

        roleSpan.textContent =
          "Kullanıcı";

      }


      roleTd.appendChild(
        roleSpan
      );


      const dateTd =
        document.createElement(
          "td"
        );


      if(user.created_at){

        dateTd.textContent =
          new Date(
            user.created_at
          ).toLocaleDateString(
            "tr-TR"
          );

      }else{

        dateTd.textContent =
          "-";

      }


      const actionTd =
        document.createElement(
          "td"
        );


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "role-actions";


      if(
        user.username ===
        currentUsername
      ){

        const self =
          document.createElement(
            "span"
          );


        self.className =
          "self-admin";


        self.textContent =
          "Kendiniz";


        actions.appendChild(
          self
        );


      }else if(
        currentRole ===
        "admin"
      ){

        /*
           MODERATÖR YETKİSİ
        */

        if(
          user.role !==
          "moderator"
        ){

          const makeButton =
            document.createElement(
              "button"
            );


          makeButton.className =
            "role-action make-moderator";


          makeButton.textContent =
            "Moderatör Yap";


          makeButton.onclick =
            function(){

              changeUserRole(
                user.id,
                "moderator"
              );

            };


          actions.appendChild(
            makeButton
          );

        }else{

          const removeButton =
            document.createElement(
              "button"
            );


          removeButton.className =
            "role-action remove-moderator";


          removeButton.textContent =
            "Moderatörlüğü Al";


          removeButton.onclick =
            function(){

              changeUserRole(
                user.id,
                "user"
              );

            };


          actions.appendChild(
            removeButton
          );

        }


        /*
           BAN KALDIRMA
        */

        const unbanButton =
          document.createElement(
            "button"
          );


        unbanButton.className =
          "role-action remove-moderator";


        unbanButton.textContent =
          "Ban Kaldır";


        unbanButton.onclick =
          function(){

            unbanUser(
              user.username
            );

          };


        actions.appendChild(
          unbanButton
        );


        /*
           SUSTURMA KALDIRMA
        */

        const unmuteButton =
          document.createElement(
            "button"
          );


        unmuteButton.className =
          "role-action make-moderator";


        unmuteButton.textContent =
          "Susturma Kaldır";


        unmuteButton.onclick =
          function(){

            unmuteUser(
              user.username
            );

          };


        actions.appendChild(
          unmuteButton
        );

      }else{

        actions.textContent =
          "-";

      }


      actionTd.appendChild(
        actions
      );


      tr.appendChild(
        usernameTd
      );

      tr.appendChild(
        genderTd
      );

      tr.appendChild(
        roleTd
      );

      tr.appendChild(
        dateTd
      );

      tr.appendChild(
        actionTd
      );


      tbody.appendChild(
        tr
      );

    }
  );

}


/* =========================
   ROL DEĞİŞTİR
========================= */

async function changeUserRole(
  userId,
  newRole
){

  if(
    currentRole !==
    "admin"
  ){

    alert(
      "Bu işlem sadece admin tarafından yapılabilir."
    );

    return;
  }


  const confirmText =
    newRole ===
    "moderator"

      ? "Bu kullanıcı moderatör yapılsın mı?"

      : "Bu kullanıcının moderatörlüğü kaldırılsın mı?";


  if(
    !confirm(
      confirmText
    )
  ){

    return;

  }


  const result =
    await supabaseClient
      .from("profiles")
      .update({

        role:
          newRole

      })
      .eq(
        "id",
        userId
      );


  if(result.error){

    console.error(
      "Rol değiştirme:",
      result.error
    );


    alert(
      "Rol değiştirilemedi: " +
      result.error.message
    );


    return;
  }


  await loadAdminUsers();

}


/* =========================
   ÇIKIŞ
========================= */

async function logout(){

  try{

    if(
      onlineRealtimeChannel
    ){

      await supabaseClient
        .removeChannel(
          onlineRealtimeChannel
        );

      onlineRealtimeChannel =
        null;

    }


    if(
      realtimeChannel
    ){

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

      realtimeChannel =
        null;

    }


    if(currentUsername){

      await supabaseClient
        .from("online_users")
        .delete()
        .eq(
          "username",
          currentUsername
        );

    }


    await supabaseClient
      .auth
      .signOut();


  }catch(error){

    console.error(
      "Çıkış:",
      error
    );

  }


  localStorage.removeItem(
    "username"
  );


  currentUsername =
    "";

  currentRole =
    "user";

  currentRoom =
    "#Cinsellik";


  displayedMessageIds.clear();

  recentLocalMessages.clear();


  closeModerationBox();


  document
    .getElementById(
      "adminPanel"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "chat"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "login"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "logoutBtn"
    )
    .style.display =
      "none";


  updateAdminButton();

}


/* =========================
   OTURUM KONTROL
========================= */

window.addEventListener(
  "load",
  async function(){

    try{

      const result =
        await supabaseClient
          .auth
          .getSession();


      if(
        result.data &&
        result.data.session
      ){

        const user =
          result.data.session.user;


        currentUsername =
          localStorage.getItem(
            "username"
          ) || "";


        if(!currentUsername){

          const metadata =
            user.user_metadata ||
            {};


          currentUsername =
            metadata.username ||
            "";

        }


        if(currentUsername){

          const banned =
            await checkBan(
              currentUsername
            );


          if(banned){

            await supabaseClient
              .auth
              .signOut();

            return;

          }

        }


        await loadMyProfile();


        if(!currentUsername){

          currentUsername =
            "Kullanici" +
            Math.floor(
              10000 +
              Math.random() *
              90000
            );

        }


        localStorage.setItem(
          "username",
          currentUsername
        );


        await enterChat();

      }

    }catch(error){

      console.error(
        "Oturum kontrolü:",
        error
      );

    }

  }
);

window.addEventListener(

    if(currentUsername){

      try{

        supabaseClient
          .from("online_users")
          .delete()
          .eq(
            "username",
            currentUsername
          );

      }catch(error){

        console.error(
          error
        );

      }

    }

  }
);
