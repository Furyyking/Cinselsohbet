<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinsel Sohbet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#111b2b;
  --navy2:#19263a;
  --pink:#e83e8c;
  --pink2:#fff0f7;
  --white:#fff;
  --bg:#f4f6f9;
  --text:#202735;
  --muted:#7b8494;
  --border:#e5e8ed;
  --green:#22c55e;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

/* ÜST BAR */

.topbar{
  height:64px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:700;
}

.logo-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 12px rgba(232,62,140,.7);
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn,
.menu-btn{
  width:40px;
  height:40px;
  border-radius:8px;
  color:white;
  background:transparent;
  font-size:19px;
}

.icon-btn:hover,
.menu-btn:hover{
  background:rgba(255,255,255,.08);
}

.menu-btn{
  display:none;
}

/* GİRİŞ */

.login-page{
  min-height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:34px;
  box-shadow:0 15px 45px rgba(17,27,43,.09);
}

.login-logo{
  text-align:center;
  margin-bottom:28px;
}
