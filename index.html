<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinsel Sohbet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111b2b;
  color:#fff;
  min-height:100vh;
}

.header{
  height:65px;
  background:#1c2a40;
  border-bottom:1px solid #34445d;
  display:flex;
  align-items:center;
  padding:0 20px;
  position:relative;
}

.logo{
  color:#e83e8c;
  font-size:22px;
  font-weight:bold;
}

.login-page{
  width:92%;
  max-width:420px;
  margin:70px auto;
  background:#1c2a40;
  padding:30px;
  border-radius:16px;
  box-shadow:0 15px 40px #0006;
}

.login-page h1{
  text-align:center;
  color:#e83e8c;
  margin-bottom:8px;
}

.login-page p{
  text-align:center;
  color:#aeb9ca;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#e83e8c;
}

.gender{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.gender button{
  flex:1;
  padding:13px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  cursor:pointer;
}

.gender button.active{
  background:#e83e8c;
  border-color:#e83e8c;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.register{
  background:#e83e8c;
}

.guest{
  margin-top:10px;
  background:#263650;
}

.btn:disabled{
  opacity:.6;
}

#loginMessage{
  text-align:center;
  margin-top:14px;
  min-height:20px;
  font-size:14px;
}

#chat{
  display:none;
  height:calc(100vh - 65px);
}

.chat-layout{
  height:100%;
  display:grid;
  grid-template-columns:220px 1fr 240px;
}

.sidebar,
.users{
  background:#1c2a40;
  padding:15px;
}

.sidebar{
  border-right:1px solid #34445d;
}

.users{
  border-left:1px solid #34445d;
}

.title{
  color:#e83e8c;
  font-weight:bold;
  margin-bottom:15px;
}

.channel{
  padding:12px;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer;
}

.channel:hover,
.channel.active{
  background:#e83e8c;
}

.main{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-title{
  padding:18px;
  border-bottom:1px solid #34445d;
  font-weight:bold;
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  background:#1c2a40;
  padding:12px;
  margin-bottom:10px;
  border-radius:9px;
  word-wrap:break-word;
}

.message b{
  color:#e83e8c;
}

.message-time{
  color:#8190a6;
  font-size:11px;
  margin-left:8px;
}

.send{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #34445d;
}

.send input{
  margin:0;
}

.send button{
  width:100px;
  border:0;
  border-radius:8px;
  background:#e83e8c;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.user{
  padding:8px 0;
}

.online::before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#20e070;
  margin-right:7px;
}

.top10{
  color:#ff4b4b;
}

.logout{
  position:absolute;
  right:20px;
  top:14px;
  padding:8px 14px;
  border:0;
  border-radius:7px;
  background:#e83e8c;
  color:#fff;
  cursor:pointer;
}

@media(max-width:800px){
  .chat-layout{
    grid-template-columns:170px 1fr;
  }

  .users{
    display:none;
  }
}

@media(max-width:600px){
  .chat-layout{
    display:block;
  }

  .sidebar{
    display:none;
  }

  .login-page{
    margin-top:45px;
  }
}
</style>
</head>

<body>

<div class="header">

  <div class="logo">
    💬 Cinsel Sohbet
  </div>

  <button
    id="logoutBtn"
    class="logout"
    style="display:none"
    onclick="logout()">
    Çıkış
  </button>

</div>


<!-- GİRİŞ -->

<div id="login">

  <div class="login-page">

    <h1>Cinsel Sohbet</h1>

    <p>Sohbete giriş yap</p>

    <input
      id="username"
      type="text"
      placeholder="Kullanıcı adı"
      autocomplete="username">

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password">

    <div class="gender">

      <button
        type="button"
        data-gender="Kadın"
        onclick="selectGender(this)">
        Kadın
      </button>

      <button
        type="button"
        data-gender="Erkek"
        onclick="selectGender(this)">
        Erkek
      </button>

    </div>

    <button
      id="loginBtn"
      class="btn register"
      type="button"
      onclick="registerUser()">
      Sohbete Gir
    </button>

    <button
      class="btn guest"
      type="button"
      onclick="guestLogin()">
      Şifresiz Misafir Girişi
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- CHAT -->

<div id="chat">

  <div class="chat-layout">

    <aside class="sidebar">

      <div class="title">
        ODALAR
      </div>

      <div
        class="channel active"
        onclick="changeRoom('#Cinsellik',this)">
        #Cinsellik
      </div>

      <div
        class="channel"
        onclick="changeRoom('#sohbet',this)">
        #sohbet
      </div>

      <div
        class="channel"
        onclick="changeRoom('#şarkı',this)">
        #şarkı
      </div>

      <div
        class="channel"
        onclick="changeRoom('#oyun',this)">
        #oyun
      </div>

      <div
        class="channel"
        onclick="changeRoom('#yardım',this)">
        #yardım
      </div>

    </aside>


    <main class="main">

      <div
        class="chat-title"
        id="roomTitle">
        #Cinsellik
      </div>

      <div
        class="messages"
        id="messages">
      </div>

      <div class="send">

        <input
          id="messageInput"
          type="text"
          placeholder="Mesajınızı yazın..."
          autocomplete="off">

        <button
          type="button"
          onclick="sendMessage()">
          Gönder
        </button>

      </div>

    </main>


    <aside class="users">

      <div class="title">
        ÇEVRİM İÇİ
      </div>

      <div id="onlineUsers"></div>

      <br>

      <div class="title">
        EN UZUN ÇEVRİM İÇİ
      </div>

      <div class="user top10">
        Henüz veri yok
      </div>

    </aside>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kreezswhqbnxvosmbxmu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sx3jrzgB5jhpgC9OU2FkGw_8lvWCIti";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   DEĞİŞKENLER
========================= */

let selectedGender = "";
let currentUsername = "";
let currentRoom = "#Cinsellik";
let realtimeChannel = null;


/* =========================
   MESAJ
========================= */

function showMessage(text,error=false){

  const box =
    document.getElementById("loginMessage");

  box.textContent = text;

  box.style.color =
    error ? "#ff5c5c" : "#55e67a";
}


/* =========================
   CİNSİYET
========================= */

function selectGender(button){

  selectedGender =
    button.dataset.gender;

  document
    .querySelectorAll(".gender button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");
}


/* =========================
   KULLANICI EMAIL
========================= */

function usernameEmail(username){

  let clean =
    username
      .toLowerCase()
      .trim()
      .replace(/ğ/g,"g")
      .replace(/ü/g,"u")
      .replace(/ş/g,"s")
      .replace(/ı/g,"i")
      .replace(/ö/g,"o")
      .replace(/ç/g,"c")
      .replace(/[^a-z0-9]/g,"");

  return clean +
    "@cinselsohbet.com";
}


/* =========================
   GİRİŞ / KAYIT
========================= */

async function registerUser(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const button =
    document.getElementById("loginBtn");


  if(!username){

    showMessage(
      "Kullanıcı adı yaz.",
      true
    );

    return;
  }


  if(username.length < 3){

    showMessage(
      "Kullanıcı adı en az 3 karakter olmalı.",
      true
    );

    return;
  }


  if(!password){

    showMessage(
      "Şifre yaz.",
      true
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Şifre en az 6 karakter olmalı.",
      true
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Bekleyin...";

  showMessage(
    "Giriş yapılıyor..."
  );


  try{

    const email =
      usernameEmail(username);


    /* ÖNCE GİRİŞ */

    const loginResult =
      await supabaseClient.auth
        .signInWithPassword({
          email:email,
          password:password
        });


    if(!loginResult.error){

      currentUsername =
        username;

      localStorage.setItem(
        "username",
        username
      );

      enterChat();

      return;
    }


    /* YOKSA KAYIT */

    const registerResult =
      await supabaseClient.auth
        .signUp({

          email:email,

          password:password,

          options:{
            data:{
              username:username,
              gender:selectedGender
            }
          }

        });


    if(registerResult.error){

      showMessage(
        registerResult.error.message,
        true
      );

      console.error(
        registerResult.error
      );

      return;
    }


    if(!registerResult.data.session){

      showMessage(
        "Hesap oluşturuldu fakat giriş yapılamadı. Email doğrulamasını kontrol et.",
        true
      );

      return;
    }


    currentUsername =
      username;

    localStorage.setItem(
      "username",
      username
    );

    enterChat();


  }catch(error){

    console.error(error);

    showMessage(
      "Hata: " + error.message,
      true
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Sohbete Gir";
  }
}


/* =========================
   MİSAFİR
========================= */

function guestLogin(){

  const number =
    Math.floor(
      10000 +
      Math.random() * 90000
    );

  currentUsername =
    "Misafir" + number;

  localStorage.setItem(
    "username",
    currentUsername
  );

  enterChat();
}


/* =========================
   CHAT'E GİR
========================= */

function enterChat(){

  document
    .getElementById("login")
    .style.display = "none";

  document
    .getElementById("chat")
    .style.display = "block";

  document
    .getElementById("logoutBtn")
    .style.display = "block";


  const online =
    document.getElementById(
      "onlineUsers"
    );

  online.innerHTML = "";

  const user =
    document.createElement("div");

  user.className =
    "user online";

  user.textContent =
    currentUsername;

  online.appendChild(user);


  loadMessages();

  startRealtime();
}


/* =========================
   MESAJLARI YÜKLE
========================= */

async function loadMessages(){

  const messagesBox =
    document.getElementById(
      "messages"
    );

  messagesBox.innerHTML = "";


  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq("room",currentRoom)
      .order("created_at",{
        ascending:true
      });


  if(result.error){

    console.error(
      "Mesaj yükleme hatası:",
      result.error
    );

    messagesBox.innerHTML =
      '<div class="message">' +
      '<b>Sistem:</b> Mesajlar yüklenemedi.' +
      '</div>';

    return;
  }


  result.data.forEach(
    message=>{
      addMessageToScreen(
        message
      );
    }
  );
}


/* =========================
   MESAJI EKRANA EKLE
========================= */

function addMessageToScreen(message){

  const messagesBox =
    document.getElementById(
      "messages"
    );


  const div =
    document.createElement("div");

  div.className =
    "message";


  const username =
    document.createElement("b");

  username.textContent =
    message.username + ":";


  const text =
    document.createTextNode(
      " " + message.message
    );


  const time =
    document.createElement("span");

  time.className =
    "message-time";


  const date =
    new Date(
      message.created_at
    );

  time.textContent =
    date.toLocaleTimeString(
      "tr-TR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  div.appendChild(username);
  div.appendChild(text);
  div.appendChild(time);

  messagesBox.appendChild(div);

  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if(!text) return;


  if(!currentUsername){

    alert(
      "Önce giriş yapmalısın."
    );

    return;
  }


  input.disabled = true;


  const result =
    await supabaseClient
      .from("messages")
      .insert({

        room:currentRoom,

        username:currentUsername,

        message:text

      })
      .select()
      .single();


  input.disabled = false;


  if(result.error){

    console.error(
      "Mesaj gönderme hatası:",
      result.error
    );

    alert(
      "Mesaj gönderilemedi: " +
      result.error.message
    );

    return;
  }


  input.value = "";

  /*
    Realtime açıksa mesaj otomatik
    olarak ekrana gelecektir.
  */
}


/* =========================
   REALTIME
========================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );
  }


  realtimeChannel =
    supabaseClient
      .channel("messages-channel")

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const message =
            payload.new;


          if(
            message.room ===
            currentRoom
          ){

            addMessageToScreen(
              message
            );

          }

        }
      )

      .subscribe(
        status=>{

          console.log(
            "Realtime:",
            status
          );

        }
      );
}


/* =========================
   ODA DEĞİŞTİR
========================= */

async function changeRoom(
  roomName,
  button
){

  currentRoom =
    roomName;


  document
    .getElementById("roomTitle")
    .textContent =
      roomName;


  document
    .querySelectorAll(".channel")
    .forEach(room=>{
      room.classList.remove(
        "active"
      );
    });


  button.classList.add(
    "active"
  );


  await loadMessages();
}


/* =========================
   ENTER İLE MESAJ
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      document.activeElement &&
      document.activeElement.id ===
        "messageInput"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   ÇIKIŞ
========================= */

async function logout(){

  if(realtimeChannel){

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );
  }


  try{

    await supabaseClient
      .auth
      .signOut();

  }catch(error){

    console.error(error);

  }


  localStorage.removeItem(
    "username"
  );

  location.reload();
}


/* =========================
   OTOMATİK OTURUM KONTROLÜ
========================= */

window.addEventListener(
  "load",
  async function(){

    try{

      const result =
        await supabaseClient.auth
          .getSession();


      if(
        result.data &&
        result.data.session
      ){

        const user =
          result.data.session.user;


        currentUsername =
          user.user_metadata &&
          user.user_metadata.username
            ? user.user_metadata.username
            : localStorage.getItem(
                "username"
              );


        if(currentUsername){

          enterChat();

        }

      }

    }catch(error){

      console.error(
        "Oturum kontrolü:",
        error
      );

    }

  }
);

</script>

</body>
</html>
