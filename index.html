              <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinsel Sohbet</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#111b2b;
  color:#fff;
  min-height:100vh
}

.header{
  height:65px;
  background:#1c2a40;
  border-bottom:1px solid #34445d;
  display:flex;
  align-items:center;
  padding:0 20px
}

.logo{
  color:#e83e8c;
  font-size:22px;
  font-weight:bold
}

.login-page{
  width:92%;
  max-width:420px;
  margin:70px auto;
  background:#1c2a40;
  padding:30px;
  border-radius:16px;
  box-shadow:0 15px 40px #0006
}

.login-page h1{
  text-align:center;
  color:#e83e8c;
  margin-bottom:8px
}

.login-page p{
  text-align:center;
  color:#aeb9ca;
  margin-bottom:25px
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  font-size:16px;
  outline:none
}

input:focus{
  border-color:#e83e8c
}

.gender{
  display:flex;
  gap:10px;
  margin-bottom:12px
}

.gender button{
  flex:1;
  padding:13px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  cursor:pointer
}

.gender button.active{
  background:#e83e8c;
  border-color:#e83e8c
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}

.register{
  background:#e83e8c
}

.guest{
  margin-top:10px;
  background:#263650
}

#chat{
  display:none;
  height:calc(100vh - 65px)
}

.chat-layout{
  height:100%;
  display:grid;
  grid-template-columns:220px 1fr 240px
}

.sidebar,.users{
  background:#1c2a40;
  padding:15px
}

.sidebar{
  border-right:1px solid #34445d
}

.users{
  border-left:1px solid #34445d
}

.title{
  color:#e83e8c;
  font-weight:bold;
  margin-bottom:15px
}

.channel{
  padding:12px;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer
}

.channel:hover,
.channel.active{
  background:#e83e8c
}

.main{
  display:flex;
  flex-direction:column;
  min-width:0
}

.chat-title{
  padding:18px;
  border-bottom:1px solid #34445d;
  font-weight:bold
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto
}

.message{
  background:#1c2a40;
  padding:12px;
  margin-bottom:10px;
  border-radius:9px
}

.message b{
  color:#e83e8c
}

.send{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #34445d
}

.send input{
  margin:0
}

.send button{
  width:100px;
  border:0;
  border-radius:8px;
  background:#e83e8c;
  color:#fff;
  font-weight:bold
}

.user{
  padding:8px 0
}

.online::before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#20e070;
  margin-right:7px
}

.admin{color:#ffd166}
.mod{color:#62d8ff}
.top10{color:#ff4b4b}

.logout{
  position:absolute;
  right:20px;
  top:14px;
  padding:8px 14px;
  border:0;
  border-radius:7px;
  background:#e83e8c;
  color:white
}

@media(max-width:800px){
  .chat-layout{
    grid-template-columns:170px 1fr
  }

  .users{
    display:none
  }
}

@media(max-width:600px){
  .chat-layout{
    display:block
  }

  .sidebar{
    display:none
  }

  .login-page{
    margin-top:45px
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">💬 Cinsel Sohbet</div>

  <button
    id="logoutBtn"
    class="logout"
    style="display:none"
    onclick="logout()">
    Çıkış
  </button>
</div>


<!-- GİRİŞ -->

<div id="login">

  <div class="login-page">

    <h1>Cinsel Sohbet</h1>

    <p>Hesabınızla sohbete katılın</p>

    <input
      id="username"
      type="text"
      placeholder="Kullanıcı adı"
      autocomplete="username">

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password">

    <div class="gender">

      <button
        type="button"
        onclick="selectGender(this)">
        Kadın
      </button>

      <button
        type="button"
        onclick="selectGender(this)">
        Erkek
      </button>

    </div>

    <button
      class="btn register"
      onclick="registerUser()">
      Kayıt Ol / Giriş Yap
    </button>

    <button
      class="btn guest"
      onclick="guestLogin()">
      Şifresiz Misafir Girişi
    </button>

  </div>

</div>


<!-- SOHBET -->

<div id="chat">

  <div class="chat-layout">

    <aside class="sidebar">

      <div class="title">ODALAR</div>

      <div class="channel active">#Cinsellik</div>
      <div class="channel">#sohbet</div>
      <div class="channel">#şarkı</div>
      <div class="channel">#oyun</div>
      <div class="channel">#yardım</div>

    </aside>


    <main class="main">

      <div
        class="chat-title"
        id="roomTitle">
        #Cinsellik
      </div>

      <div
        class="messages"
        id="messages">

        <div class="message">
          <b>👑 Admin:</
