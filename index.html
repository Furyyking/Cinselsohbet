<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Cinsel Sohbet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   GENEL
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111b2b;
  color:#fff;
  min-height:100vh;
}

button{
  font-family:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  height:65px;
  background:#1c2a40;
  border-bottom:1px solid #34445d;
  display:flex;
  align-items:center;
  padding:0 20px;
  position:relative;
}

.logo{
  color:#e83e8c;
  font-size:22px;
  font-weight:bold;
}

.header-buttons{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.header-btn{
  padding:9px 13px;
  border:0;
  border-radius:7px;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.admin-btn{
  background:#7c4dff;
}

.logout{
  background:#e83e8c;
}


/* =========================
   GİRİŞ
========================= */

.login-page{
  width:92%;
  max-width:420px;
  margin:70px auto;
  background:#1c2a40;
  padding:30px;
  border-radius:16px;
  box-shadow:0 15px 40px #0006;
}

.login-page h1{
  text-align:center;
  color:#e83e8c;
  margin-bottom:8px;
}

.login-page p{
  text-align:center;
  color:#aeb9ca;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#e83e8c;
}

.gender{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.gender button{
  flex:1;
  padding:13px;
  border:1px solid #40516a;
  border-radius:8px;
  background:#111b2b;
  color:#fff;
  cursor:pointer;
}

.gender button.active{
  background:#e83e8c;
  border-color:#e83e8c;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:wait;
}

.register{
  background:#e83e8c;
}

.guest{
  margin-top:10px;
  background:#263650;
}

#loginMessage{
  text-align:center;
  margin-top:14px;
  min-height:20px;
  font-size:14px;
}


/* =========================
   CHAT
========================= */

#chat{
  display:none;
  height:calc(100vh - 65px);
}

.chat-layout{
  height:100%;
  display:grid;
  grid-template-columns:220px 1fr 240px;
}

.sidebar,
.users{
  background:#1c2a40;
  padding:15px;
}

.sidebar{
  border-right:1px solid #34445d;
}

.users{
  border-left:1px solid #34445d;
}

.title{
  color:#e83e8c;
  font-weight:bold;
  margin-bottom:15px;
}

.channel{
  padding:12px;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer;
}

.channel:hover,
.channel.active{
  background:#e83e8c;
}

.main{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
}

.chat-title{
  padding:18px;
  border-bottom:1px solid #34445d;
  font-weight:bold;
  flex-shrink:0;
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  min-height:0;
}

.message{
  background:#1c2a40;
  padding:12px;
  margin-bottom:10px;
  border-radius:9px;
  word-wrap:break-word;
}

.message b{
  color:#e83e8c;
}

.message-time{
  color:#8190a6;
  font-size:11px;
  margin-left:8px;
}

.send{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #34445d;
  flex-shrink:0;
}

.send input{
  margin:0;
}

.send button{
  width:100px;
  border:0;
  border-radius:8px;
  background:#e83e8c;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.user{
  padding:8px 0;
}

.online::before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#20e070;
  margin-right:7px;
}


/* =========================
   ADMIN PANEL
========================= */

#adminPanel{
  display:none;
  position:fixed;
  inset:65px 0 0 0;
  background:#111b2b;
  z-index:1000;
  overflow-y:auto;
}

.admin-container{
  width:94%;
  max-width:1100px;
  margin:25px auto;
}

.admin-header{
  background:#1c2a40;
  border:1px solid #34445d;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.admin-header h2{
  color:#e83e8c;
}

.close-admin{
  border:0;
  border-radius:7px;
  background:#e83e8c;
  color:#fff;
  padding:9px 14px;
  cursor:pointer;
  font-weight:bold;
}

.admin-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.admin-card{
  background:#1c2a40;
  border:1px solid #34445d;
  border-radius:12px;
  padding:18px;
}

.admin-card-title{
  color:#aeb9ca;
  font-size:14px;
  margin-bottom:8px;
}

.admin-card-number{
  font-size:27px;
  font-weight:bold;
  color:#fff;
}

.admin-table-box{
  background:#1c2a40;
  border:1px solid #34445d;
  border-radius:12px;
  overflow:hidden;
}

.admin-table-title{
  padding:17px;
  border-bottom:1px solid #34445d;
  color:#e83e8c;
  font-weight:bold;
}

.admin-table-wrapper{
  overflow-x:auto;
}

.admin-table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

.admin-table th,
.admin-table td{
  padding:13px;
  text-align:left;
  border-bottom:1px solid #34445d;
}

.admin-table th{
  color:#aeb9ca;
  font-size:13px;
}

.admin-table td{
  font-size:14px;
}

.role{
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.role-admin{
  background:#7c4dff;
}

.role-moderator{
  background:#1976d2;
}

.role-user{
  background:#40516a;
}

.admin-refresh{
  padding:9px 13px;
  border:0;
  border-radius:7px;
  background:#263650;
  color:#fff;
  cursor:pointer;
}

.admin-empty{
  padding:25px;
  text-align:center;
  color:#aeb9ca;
}


/* =========================
   MOBİL
========================= */

@media(max-width:800px){

  .chat-layout{
    display:flex;
    flex-direction:column;
    height:100%;
  }

  .sidebar{
    display:flex !important;
    flex-direction:row;
    align-items:center;
    width:100%;
    min-width:100%;
    height:60px;
    min-height:60px;
    padding:7px 8px;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    border-right:0;
    border-bottom:1px solid #34445d;
    flex-shrink:0;
  }

  .sidebar .title{
    display:none;
  }

  .channel{
    flex:0 0 auto;
    margin:0;
    padding:11px 15px;
    white-space:nowrap;
  }

  .main{
    flex:1;
    width:100%;
    min-height:0;
  }

  .users{
    display:none;
  }

  .admin-cards{
    grid-template-columns:1fr;
  }
}


@media(max-width:600px){

  #chat{
    height:calc(100vh - 65px);
  }

  .chat-layout{
    display:flex !important;
    flex-direction:column;
  }

  .sidebar{
    display:flex !important;
    visibility:visible !important;
  }

  .channel{
    display:block !important;
    visibility:visible !important;
  }

  .main{
    height:calc(100% - 58px);
  }

  .chat-title{
    padding:14px;
  }

  .messages{
    padding:12px;
  }

  .send{
    padding:10px;
    gap:7px;
  }

  .send button{
    width:75px;
    min-width:75px;
  }

  .login-page{
    margin-top:45px;
    padding:25px 20px;
  }

  .logo{
    font-size:20px;
  }

  .header{
    padding:0 10px;
  }

  .header-buttons{
    gap:5px;
  }

  .header-btn{
    padding:8px 9px;
    font-size:12px;
  }

  .admin-container{
    width:94%;
    margin:15px auto;
  }

  .admin-header{
    padding:14px;
  }

  .admin-header h2{
    font-size:18px;
  }

  .close-admin{
    padding:8px 10px;
    font-size:12px;
  }

}

</style>
</head>

<div id="login">

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kreezswhqbnxvosmbxmu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sx3jrzgB5jhpgC9OU2FkGw_8lvWCIti";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================
   DEĞİŞKENLER
========================= */

let selectedGender = "";

let currentUsername = "";

let currentRoom = "#Cinsellik";

let currentRole = "user";

let realtimeChannel = null;

let onlineRealtimeChannel = null;



/* =========================
   GİRİŞ MESAJI
========================= */

function showMessage(
  text,
  error=false
){

  const box =
    document.getElementById(
      "loginMessage"
    );


  box.textContent =
    text;


  box.style.color =
    error
      ? "#ff5c5c"
      : "#55e67a";
}



/* =========================
   CİNSİYET
========================= */

function selectGender(button){

  selectedGender =
    button.dataset.gender;


  document
    .querySelectorAll(
      ".gender button"
    )
    .forEach(btn=>{

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );
}



/* =========================
   EMAIL
========================= */

function usernameEmail(username){

  let clean =
    username
      .toLowerCase()
      .trim()
      .replace(/ğ/g,"g")
      .replace(/ü/g,"u")
      .replace(/ş/g,"s")
      .replace(/ı/g,"i")
      .replace(/ö/g,"o")
      .replace(/ç/g,"c")
      .replace(/[^a-z0-9]/g,"");


  return clean +
    "@cinselsohbet.com";
}



/* =========================
   PROFİL BİLGİSİ
========================= */

async function loadMyProfile(){

  const userResult =
    await supabaseClient
      .auth
      .getUser();


  if(
    userResult.error ||
    !userResult.data.user
  ){

    currentRole =
      "user";

    return;
  }


  const userId =
    userResult.data.user.id;


  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "username,gender,role"
      )
      .eq(
        "id",
        userId
      )
      .maybeSingle();


  if(result.error){

    console.error(
      "Profil yükleme:",
      result.error
    );

    currentRole =
      "user";

    return;
  }


  if(result.data){

    currentRole =
      result.data.role ||
      "user";


    if(
      result.data.username
    ){

      currentUsername =
        result.data.username;

      localStorage.setItem(
        "username",
        currentUsername
      );

    }

  }


  updateAdminButton();
}



/* =========================
   ADMIN BUTONU
========================= */

function updateAdminButton(){

  const button =
    document.getElementById(
      "adminBtn"
    );


  if(
    currentRole === "admin" ||
    currentRole === "moderator"
  ){

    button.style.display =
      "block";

  }else{

    button.style.display =
      "none";

  }
}



/* =========================
   GİRİŞ / KAYIT
========================= */

async function registerUser(){

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const button =
    document.getElementById(
      "loginBtn"
    );


  if(!username){

    showMessage(
      "Kullanıcı adı yaz.",
      true
    );

    return;
  }


  if(username.length < 3){

    showMessage(
      "Kullanıcı adı en az 3 karakter olmalı.",
      true
    );

    return;
  }


  if(!password){

    showMessage(
      "Şifre yaz.",
      true
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Şifre en az 6 karakter olmalı.",
      true
    );

    return;
  }


  button.disabled =
    true;


  button.textContent =
    "Bekleyin...";


  showMessage(
    "Giriş yapılıyor..."
  );


  try{

    const email =
      usernameEmail(
        username
      );


    /* ÖNCE GİRİŞ */

    const loginResult =
      await supabaseClient
        .auth
        .signInWithPassword({

          email:email,

          password:password

        });


    if(!loginResult.error){

      currentUsername =
        username;


      localStorage.setItem(
        "username",
        username
      );


      await loadMyProfile();


      enterChat();

      return;
    }


    /* KAYIT */

    const registerResult =
      await supabaseClient
        .auth
        .signUp({

          email:email,

          password:password,

          options:{

            data:{

              username:
                username,

              gender:
                selectedGender

            }

          }

        });


    if(registerResult.error){

      showMessage(
        registerResult.error.message,
        true
      );

      console.error(
        registerResult.error
      );

      return;
    }


    if(
      !registerResult.data.session
    ){

      showMessage(
        "Hesap oluşturuldu fakat giriş yapılamadı.",
        true
      );

      return;
    }


    currentUsername =
      username;


    localStorage.setItem(
      "username",
      username
    );


    await loadMyProfile();


    enterChat();


  }catch(error){

    console.error(error);


    showMessage(
      "Hata: " +
      error.message,
      true
    );

  }finally{

    button.disabled =
      false;


    button.textContent =
      "Sohbete Gir";
  }
}



/* =========================
   MİSAFİR
========================= */

function guestLogin(){

  const number =
    Math.floor(
      10000 +
      Math.random() *
      90000
    );


  currentUsername =
    "Misafir" +
    number;


  currentRole =
    "guest";


  localStorage.setItem(
    "username",
    currentUsername
  );


  updateAdminButton();


  enterChat();
}



/* =========================
   CHAT'E GİR
========================= */

function enterChat(){

  document
    .getElementById(
      "login"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "chat"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "logoutBtn"
    )
    .style.display =
      "block";


  loadMessages();

  startRealtime();

  joinOnlineUsers();
}



/* =========================
   MESAJLARI YÜKLE
========================= */

async function loadMessages(){

  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML =
    "";


  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "room",
        currentRoom
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(result.error){

    console.error(
      "Mesaj yükleme:",
      result.error
    );


    box.innerHTML =
      '<div class="message">' +
      '<b>Sistem:</b> Mesajlar yüklenemedi.' +
      '</div>';


    return;
  }


  result.data.forEach(
    message=>{

      addMessageToScreen(
        message
      );

    }
  );
}



/* =========================
   MESAJI EKRANA EKLE
========================= */

function addMessageToScreen(
  message
){

  const box =
    document.getElementById(
      "messages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message";


  const username =
    document.createElement(
      "b"
    );


  username.textContent =
    message.username +
    ":";


  const text =
    document.createTextNode(
      " " +
      message.message
    );


  const time =
    document.createElement(
      "span"
    );


  time.className =
    "message-time";


  const date =
    new Date(
      message.created_at
    );


  time.textContent =
    date.toLocaleTimeString(
      "tr-TR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  div.appendChild(
    username
  );


  div.appendChild(
    text
  );


  div.appendChild(
    time
  );


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;
}



/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text)
    return;


  if(!currentUsername){

    alert(
      "Önce giriş yapmalısın."
    );

    return;
  }


  input.disabled =
    true;


  const result =
    await supabaseClient
      .from("messages")
      .insert({

        room:
          currentRoom,

        username:
          currentUsername,

        message:
          text

      })
      .select()
      .single();


  input.disabled =
    false;


  if(result.error){

    console.error(
      "Mesaj gönderme:",
      result.error
    );


    alert(
      "Mesaj gönderilemedi: " +
      result.error.message
    );


    return;
  }


  input.value =
    "";
}



/* =========================
   MESAJ REALTIME
========================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "messages-channel"
      )

      .on(
        "postgres_changes",
        {

          event:"INSERT",

          schema:"public",

          table:"messages"

        },

        payload=>{

          const message =
            payload.new;


          if(
            message.room ===
            currentRoom
          ){

            addMessageToScreen(
              message
            );

          }

        }
      )

      .subscribe();
}



/* =========================
   ONLINE KULLANICI
========================= */

async function joinOnlineUsers(){

  if(!currentUsername)
    return;


  await supabaseClient
    .from("online_users")
    .delete()
    .eq(
      "username",
      currentUsername
    );


  const result =
    await supabaseClient
      .from("online_users")
      .insert({

        username:
          currentUsername,

        room:
          currentRoom

      })
      .select()
      .single();


  if(result.error){

    console.error(
      "Online kullanıcı:",
      result.error
    );

    return;
  }


  loadOnlineUsers();

  startOnlineRealtime();
}



/* =========================
   ONLINE LİSTE
========================= */

async function loadOnlineUsers(){

  const box =
    document.getElementById(
      "onlineUsers"
    );


  if(!box)
    return;


  const result =
    await supabaseClient
      .from("online_users")
      .select("*");


  if(result.error){

    console.error(
      "Online liste:",
      result.error
    );

    return;
  }


  box.innerHTML =
    "";


  result.data.forEach(
    user=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "user online";


      div.textContent =
        user.username;


      box.appendChild(
        div
      );

    }
  );
}



/* =========================
   ONLINE REALTIME
========================= */

function startOnlineRealtime(){

  if(onlineRealtimeChannel){

    supabaseClient
      .removeChannel(
        onlineRealtimeChannel
      );

  }


  onlineRealtimeChannel =
    supabaseClient
      .channel(
        "online-users-channel"
      )

      .on(
        "postgres_changes",
        {

          event:"*",

          schema:"public",

          table:"online_users"

        },

        function(){

          loadOnlineUsers();

        }
      )

      .subscribe();
}



/* =========================
   ODA DEĞİŞTİR
========================= */

async function changeRoom(
  roomName,
  button
){

  currentRoom =
    roomName;


  document
    .getElementById(
      "roomTitle"
    )
    .textContent =
      roomName;


  document
    .querySelectorAll(
      ".channel"
    )
    .forEach(room=>{

      room.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  await loadMessages();


  if(currentUsername){

    await supabaseClient
      .from("online_users")
      .update({

        room:
          currentRoom

      })
      .eq(
        "username",
        currentUsername
      );

  }


  loadOnlineUsers();
}



/* =========================
   ADMIN PANELİ AÇ
========================= */

async function openAdminPanel(){

  if(
    currentRole !== "admin" &&
    currentRole !== "moderator"
  ){

    alert(
      "Bu bölüme erişim yetkiniz yok."
    );

  document
    .getElementById(

/* =========================
   ADMIN PANELİ KAPAT
========================= */

function closeAdminPanel(){

  document
    .getElementById(
      "adminPanel"
    )
    .style.display =
      "none";
}



/* =========================
   ADMIN KULLANICILARI
========================= */

async function loadAdminUsers(){

  const tbody =
    document.getElementById(
      "adminUsers"
    );


  tbody.innerHTML =
    '<tr><td colspan="4" style="text-align:center;padding:25px">Yükleniyor...</td></tr>';


  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,gender,role,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      "Admin kullanıcıları:",
      result.error
    );


    tbody.innerHTML =
      '<tr><td colspan="4" style="text-align:center;padding:25px;color:#ff5c5c">Kullanıcılar yüklenemedi.</td></tr>';


    return;
  }


  const users =
    result.data || [];


  document
    .getElementById(
      "totalUsers"
    )
    .textContent =
      users.length;


  document
    .getElementById(
      "totalAdmins"
    )
    .textContent =
      users.filter(
        user =>
          user.role ===
          "admin"
      ).length;


  document
    .getElementById(
      "totalModerators"
    )
    .textContent =
      users.filter(
        user =>
          user.role ===
          "moderator"
      ).length;


  if(!users.length){

    tbody.innerHTML =
      '<tr><td colspan="4" class="admin-empty">Henüz kullanıcı yok.</td></tr>';

    return;
  }


  tbody.innerHTML =
    "";


  users.forEach(
    user=>{

      const tr =
        document.createElement(
          "tr"
        );


      const username =
        document.createElement(
          "td"
        );


      username.textContent =
        user.username ||
        "Kullanıcı";


      const gender =
        document.createElement(
          "td"
        );


      gender.textContent =
        user.gender ||
        "-";


      const role =
        document.createElement(
          "td"
        );


      const roleSpan =
        document.createElement(
          "span"
        );


      roleSpan.className =
        "role";


      if(
        user.role ===
        "admin"
      ){

        roleSpan.classList.add(
          "role-admin"
        );

        roleSpan.textContent =
          "Admin";

      }else if(
        user.role ===
        "moderator"
      ){

        roleSpan.classList.add(
          "role-moderator"
        );

        roleSpan.textContent =
          "Moderatör";

      }else{

        roleSpan.classList.add(
          "role-user"
        );

        roleSpan.textContent =
          "Kullanıcı";

      }


      role.appendChild(
        roleSpan
      );


      const created =
        document.createElement(
          "td"
        );


      if(user.created_at){

        created.textContent =
          new Date(
            user.created_at
          ).toLocaleDateString(
            "tr-TR"
          );

      }else{

        created.textContent =
          "-";

      }


      tr.appendChild(
        username
      );

      tr.appendChild(
        gender
      );

      tr.appendChild(
        role
      );

      tr.appendChild(
        created
      );


      tbody.appendChild(
        tr
      );

    }
  );
}

   ENTER İLE MESAJ
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      document.activeElement &&
      document.activeElement.id ===
        "messageInput"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);



/* =========================
   ÇIKIŞ
========================= */

async function logout(){

  if(currentUsername){

    try{

      await supabaseClient
        .from("online_users")
        .delete()
        .eq(
          "username",
          currentUsername
        );

    }catch(error){

      console.error(
        "Online kullanıcı silme:",
        error
      );

    }

  }


  if(realtimeChannel){

    try{

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }catch(error){

      console.error(
        error
      );

    }

    realtimeChannel =
      null;
  }


  if(onlineRealtimeChannel){

    try{

      await supabaseClient
        .removeChannel(
          onlineRealtimeChannel
        );

    }catch(error){

      console.error(
        error
      );

    }

    onlineRealtimeChannel =
      null;
  }


  try{

    await supabaseClient
      .auth
      .signOut();

  }catch(error){

    console.error(
      "Çıkış hatası:",
      error
    );

  }


  localStorage.removeItem(
    "username"
  );


  currentUsername =
    "";

  currentRole =
    "user";

  currentRoom =
    "#Cinsellik";

  selectedGender =
    "";


  location.reload();
}



/* =========================
   OTURUM KONTROL
========================= */

window.addEventListener(
  "load",
  async function(){

    try{

      const result =
        await supabaseClient
          .auth
          .getSession();


      const session =
        result.data.session;


      if(session){

        const savedUsername =
          localStorage.getItem(
            "username"
          );


        if(savedUsername){

          currentUsername =
            savedUsername;

        }else{

          currentUsername =
            session.user
              .user_metadata
              ?.username ||
            session.user
              .email
              ?.split("@")[0] ||
            "Kullanıcı";


          localStorage.setItem(
            "username",
            currentUsername
          );

        }


        await loadMyProfile();


        enterChat();

      }

    }catch(error){

      console.error(
        "Oturum kontrolü:",
        error
      );

    }

  }
);
